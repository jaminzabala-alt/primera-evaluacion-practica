services:
  postgres:
    image: postgres:16-alpine
    container_name: exam-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-orders_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orders_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: exam-orders-service
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-orders_db}
    expose:
      - "3001"
    networks:
      - exam-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: exam-gateway
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      ORDERS_SERVICE_URL: http://orders-service:3001
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    networks:
      - exam-network
    depends_on:
      orders-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  exam-network:
    driver: bridge

volumes:
  postgres_data:
